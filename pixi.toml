[workspace]
authors = ["Dan Olds <dpolds@gmail.com>", "Adam Corrao <95718914+AdamCorrao@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "PowderLine"
platforms = ["linux-64", "win-64", "osx-arm64"]
version = "0.1.1"
preview = ["pixi-build"]

[tasks]
kicker = "PYTHONPATH=$PWD/src:$PYTHONPATH python src/powderline/kicker.py"
topas-kicker = "PYTHONPATH=$PWD/src:$PYTHONPATH python -m powderline.topas.kicker"
# Cross-platform (task-level env avoids Unix-only shell syntax; see
# docs/cross-platform-guide.md Issue B for the remaining tasks)
mp-simulate = { cmd = "python -m powderline.mp_simulate", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" } }
gsas-server = "PYTHONPATH=$PWD/src:$PYTHONPATH python src/powderline/gsas_server.py"
test = "PYTHONPATH=$PWD/src:$PYTHONPATH pytest -v"
docs = "sphinx-build -W --keep-going -b html docs docs/_build/html"
docs-clean = "rm -rf docs/_build"
ui = 'GSASII_NOPATHHACKING="true" python -m GSASII' # to test running GSAS-II GUI
update-code-hash = "python scripts/update_code_hash.py"


[dependencies]
python = ">=3.10"
hatchling = ">=1.24"
pydantic = ">=2.0"
h5py = ">=3.12.1,<4"
imageio = ">=2.36.1,<3"
matplotlib = ">=3.10.0,<4"
meson-python = ">=0.17.1,<0.18"
ninja = ">=1.12.1,<2"
numpy = ">=2.2.1,<3"
pillow = ">=11.1.0,<12"
pkg-config = ">=0.29.2,<0.30"
pyopengl = ">=3.1.6,<4"
pyproject-metadata = ">=0.9.0,<0.10"
requests = ">=2.32.3,<3"
scipy = ">=1.15.0,<2"
tomli = ">=2.2.1,<3"
wheel = ">=0.45.1,<0.46"
wxpython = ">=4.2.2,<5"
pip = ">=25.2,<26"
zarr = ">=2.18.3,<4"
xmltodict = ">=0.14.2,<0.15"
pycifrw = ">=4.4.0"
pytest = ">=8.3.4,<9"
gitpython = ">=3.1.44,<4"
cython = ">=3.0.11,<4"
seekpath = ">=2.1.0,<3"
pybaselines = ">=1.2.0,<2"
pyyaml = ">=6.0.3,<7"
pandas = ">=2.3.3,<3"
sphinx = ">=8.0.0,<9"
sphinx_rtd_theme = ">=3.0.0,<4"
myst-parser = ">=4.0.0,<5"
mp-api = ">=0.46.4,<1"
emmet-core = ">=0.87.1,<0.88"
fastapi = ">=0.115.0,<1"
uvicorn = ">=0.34.0,<1"
httpx = ">=0.28.0,<1"
gemmi = ">=0.7.5,<0.8"
# GSAS-II is built as a conda package via pixi-build (see `preview` above) from
# the tacaswell fork, which adds the conda recipe. This installs GSAS-II on ALL
# platforms (linux-64/win-64/osx-arm64), unlike the former linux-64-only pip pin.
# Currently resolves to GSAS-II v5.7.9. Note: a GSAS-II (or scipy/BLAS) change can
# shift refined-parameter results, so the regression tests compare
# refined_parameters.csv within tolerance (tests/test_example_LaB6_regression.py
# `refined_params_match`). The win-64 TOPAS path still imports zero GSAS-II — that
# guarantee is enforced by the subprocess import-block tests, not by GSAS-II's
# absence. Don't change the rev casually; re-check the regression suite if you do.
GSAS-II = { git = "https://github.com/tacaswell/GSAS-II", rev = "enh/pixi_pkg" }



[pypi-dependencies]
powderline = { path = ".", editable = true }

[feature.easydiff.dependencies]
python = ">=3.12"                 # easydiffraction floor; default env stays >=3.10
"diffpy.pdffit2" = "*"            # from conda-forge: its PyPI sdist needs GSL to build

[feature.easydiff.pypi-dependencies]
easydiffraction = ">=0.20.1,<0.21"

[environments]
easydiff = ["easydiff"]
