[build-system]
# >=1.26: first hatchling with PEP 639 support for the SPDX string `license`
# and `license-files` fields used below.
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "powderline"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Automated powder X-ray diffraction refinement from a declarative JSON recipe, on GSAS-II, TOPAS 6 or easydiffraction, with standardized results"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Dan Olds", email = "dpolds@gmail.com" },
    { name = "Adam Corrao", email = "95718914+AdamCorrao@users.noreply.github.com" },
]
keywords = [
    "powder-diffraction",
    "rietveld",
    "gsas-ii",
    "topas",
    "crystallography",
    "xrd",
    "synchrotron",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=2.0",
    "scipy>=1.15",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "gemmi==0.7.5",  # exact: the space-group names and symmetry rules depend on it (pixi.toml)
    "packaging>=22",
]

# Gateway plugins: each entry targets an engine-free factory
# module. Entry-point metadata is written at install time -- after editing this
# table, re-install the editable package (`pixi reinstall powderline`) or the
# registry finds no gateways.
# The one CLI: ``powderline <recipe.json>``; ``pixi run kicker`` runs the
# same ``main`` (task names are pixi.toml's). Console scripts are written at install
# time too (``pixi reinstall powderline``).
[project.scripts]
powderline = "powderline.kicker:main"

[project.entry-points."powderline.gateways"]
gsasii = "powderline.gateways.gsasii.gateway:get_gateway"
topas = "powderline.gateways.topas.gateway:get_gateway"
easydiffraction = "powderline.gateways.easydiffraction.gateway:get_gateway"

[project.urls]
Homepage = "https://github.com/NSLS2/PowderLine"
Documentation = "https://nsls2.github.io/PowderLine/"
Repository = "https://github.com/NSLS2/PowderLine"
Issues = "https://github.com/NSLS2/PowderLine/issues"

[tool.hatch.version]
path = "src/powderline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/powderline"]

[tool.hatch.build.targets.sdist]
# Keep the sdist minimal: without this, hatchling defaults to shipping the
# whole tree — including examples/ (embedded diffraction patterns and
# regression references, ~14 MB) and pixi.lock. Tests need examples/ to run,
# so test from a git clone, not an sdist.
only-include = ["src/powderline", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Suite markers. Every test carries
# exactly ONE suite marker -- tests/conftest.py refuses to run otherwise -- plus
# the optional `slow`. The pixi tasks select on them (`test`, `test-gsasii`,
# `test-easydiffraction`, `test-topas`, `test-all`; see pixi.toml), and a run
# restricted to core/topas_gen installs the core guard (conftest.py) that
# blocks every engine import.
addopts = "--strict-markers"
markers = [
    "core: imports no engine and runs no engine subprocess; the no-plugin suite of the default env",
    "gsasii: imports GSAS-II or runs `pixi run kicker` / a GSAS-II refinement; needs the gsasii env",
    "topas_gen: TOPAS input generation, goldens, schema -- engine-free (gemmi only); runs in the default env",
    "topas_exec: executes tc.exe -- the TOPAS Windows machine only; skips with a reason when tc.exe is absent (no test today)",
    "easydiffraction: imports easydiffraction/cryspy/CrysFML; needs the easydiffraction env",
    "slow: a full refinement runs (kicker subprocess, execution_mode='subprocess', the GSAS-II server, the easydiffraction goldens)",
]
