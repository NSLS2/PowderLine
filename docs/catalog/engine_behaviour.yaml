# --- Refinement, convergence and failures -----------------------------------

- id: EB-32
  engine: gsasii
  versions: GSAS-II 5.7.9
  topic: refinement
  title: Refinement messages are only printed and stored
  engine_does: >-
    `Refine` returns nothing on success. Its messages about frozen limits,
    parameters dropped as singular and SVD are only printed and stored in the
    project.
  powderline_does: >-
    The gateway reads the stored messages into warnings.
  you_see: [gsasii_refinement_message]
  status: warned

- id: EB-33
  engine: gsasii
  versions: GSAS-II 5.7.9
  topic: refinement
  title: The parameter count includes parameters dropped as singular
  engine_does: >-
    GSAS-II's `Nvars` includes parameters it dropped as singular.
  powderline_does: >-
    PowderLine reports the drop as a warning and does not subtract it. In a
    single-peak fit, the count is taken after the drops.
  you_see: [gsasii_refinement_message]
  status: warned

- id: EB-53
  engine: gsasii
  versions: GSAS-II 5.7.9
  topic: refinement
  title: Single-peak fitting ignores some refine flags silently
  engine_does: >-
    With the instrument profile in use, a peak's own σ² and γ flags are
    ignored. With per-peak widths, the U … Z flags are ignored. Refining any
    σ² clears the U, V, W flags. Singular parameters are dropped without a
    message.
  powderline_does: >-
    A refine flag on the width source not in use is a validation error. Any
    remaining silent drop gets a warning.
  you_see: [validation error, gsasii_parameters_not_varied]
  status: handled

- id: EB-92
  engine: gsasii
  versions: GSAS-II 5.7.9
  topic: refinement
  title: A peak fit fills no covariance block
  engine_does: >-
    `DoPeakFit` keeps its varied names and ESDs in the Peak List's own
    record, and writes the refined values in place. A peak fit therefore has
    no refined-parameter rows.
  powderline_does: >-
    The result's `peak_fit` block reads the values and ESDs from there. The
    output recipe is built from it.
  you_see: []
  status: handled

- id: EB-38
  engine: gsasii
  versions: GSAS-II 5.7.9
  topic: refinement
  title: A peak outside the fit window makes the peak fit fail with a bare TypeError
  engine_does: >-
    A Peak List or background peak outside the fit window makes GSAS-II's
    peak fit fail with a bare `TypeError`.
  powderline_does: >-
    A peak outside the fit window is a validation error. A peak fit that still
    fails raises `EngineExecutionError` with a clear reason.
  you_see: [validation error, peak_fit_failed]
  status: handled

- id: EB-99
  engine: gsasii
  versions: GSAS-II 5.7.9
  topic: refinement
  title: An aborted refinement keeps a worthless pattern
  engine_does: >-
    When no damped step lowers χ², GSAS-II aborts the refinement. It keeps
    the last accepted values but stores the rejected step's pattern and a wR
    at its 100 % cap. No statistic belongs to the parameters. GSAS-II's GUI
    shows this only as "Minimizer halted because chi**2 increased". A
    March–Dollase ratio started at exactly 1.0 in a cubic phase triggers it.
  powderline_does: >-
    PowderLine is deliberately stricter: an aborted Rietveld refinement is a
    failure, reason `diverged`. Simulations are exempt.
  you_see: [diverged]
  status: handled

- id: EB-60
  engine: topas
  versions: TOPAS 6
  topic: refinement
  title: tc.exe gives the same exit code on success and failure
  engine_does: >-
    `tc.exe` returns the same exit code on success and failure. It prints its
    messages only to its console window.
  powderline_does: >-
    Success is judged from the expected output files, removed before the run.
    A missing file raises `EngineExecutionError`. Its failure record lists
    the INP and data kept, the `tc.exe` path and exit code, and whatever
    `tc.exe` printed. Otherwise look at TOPAS's console window and `tc.log`.
  you_see: [output_missing]
  status: handled

- id: EB-85
  engine: topas
  versions: TOPAS 6
  topic: refinement
  title: TOPAS 6 exposes no convergence signal
  engine_does: >-
    TOPAS 6 writes no convergence signal in its files.
  powderline_does: >-
    `converged` is always `null` for TOPAS 6.
  you_see: []
  status: documented

- id: EB-63
  engine: topas
  versions: TOPAS 6
  topic: refinement
  title: A non-finite term silently zeroes a phase
  engine_does: >-
    A non-finite term silently zeroes a phase, and the background absorbs the
    pattern.
  powderline_does: >-
    A phase with all-zero calculated intensities gets an informative note. A
    zero contribution can be legitimate: a phase absent from the sample.
  you_see: [topas_phase_contributes_nothing]
  status: warned

- id: EB-65
  engine: topas
  versions: TOPAS 6
  topic: refinement
  title: The independent-parameter count works but is undocumented
  engine_does: >-
    `Get(number_independent_parameters)` works in TOPAS 6 although it is
    undocumented. It excludes parameters with zero derivative.
  powderline_does: >-
    PowderLine uses it as `parameters_varied`, and warns when it is lower than
    the parameters requested.
  you_see: [topas_parameters_not_varied]
  status: warned

# --- Statistics -------------------------------------------------------------

- id: EB-52
  engine: gsasii
  versions: GSAS-II 5.7.9
  topic: statistics
  title: GOF has two meanings, and R values are capped at 100 %
  engine_does: >-
    GSAS-II's `GOF` is √(reduced χ²) in a Rietveld refinement and the reduced
    χ² itself in a Peak List fit. GSAS-II caps R and wR at 100 %, so a
    simulation against placeholder data and a diverged refinement both read
    100 %. A non-finite pattern prints wR `nan` and reports 100 %.
  powderline_does: >-
    The result's `rwp`, `r_exp`, `gof` and `chi2_red` are PowderLine's, with
    one formula for every engine. GSAS-II's own values stay under
    `engine_details`. A non-finite calculated pattern is a failure, reason
    `diverged`. A poor fit at the cap is still reported, with core's uncapped
    Rwp beside it.
  you_see: [diverged]
  status: handled

- id: EB-81
  engine: easydiffraction
  versions: easydiffraction 0.21.1
  topic: statistics
  title: A parameter without effect gets no ESD
  engine_does: >-
    easydiffraction's free-parameter count is lmfit's. A parameter without
    effect gets no ESD. Its own `prof_wr_factor` is 1/σ²-weighted.
  powderline_does: >-
    `parameters_varied` is lmfit's count. The engine's own statistics stay
    under `engine_details`.
  you_see: [easydiffraction_parameters_not_varied]
  status: warned

- id: EB-88
  engine: all
  versions: GSAS-II 5.7.9; easydiffraction 0.21.1 (CrysPy 0.13.0, CrysFML 0.8.0)
  topic: statistics
  title: A symmetric profile shifts the refined cell
  engine_does: >-
    Lattice parameters agree between GSAS-II and easydiffraction when axial
    asymmetry is modelled physically (FCJ). With a symmetric profile they
    shift by +67 to +91 ppm, whichever calculator runs it.
  powderline_does: >-
    Documented on the cross-engine comparison. Rwp compares models fitted to
    the same points, not engines.
  you_see: []
  status: documented

# --- Calculators ------------------------------------------------------------

- id: EB-76
  engine: easydiffraction
  versions: easydiffraction 0.21.1 (CrysPy 0.13.0, CrysFML 0.8.0)
  topic: calculators
  title: The two calculators compute different peak types
  engine_does: >-
    CrysPy computes `cwl-pseudo-voigt` and the Bérar–Baldinozzi empirical
    asymmetry. CrysFML computes `cwl-pseudo-voigt` and the
    Thompson–Cox–Hastings profile with FCJ axial asymmetry. Both
    pseudo-Voigts are the TCH pseudo-Voigt with Caglioti Gaussian and
    X tanθ + Y/cosθ Lorentzian widths. `cutoff_fwhm` acts in CrysPy only;
    CrysFML uses a fixed 30-FWHM window.
  powderline_does: >-
    The peak type must be one the chosen calculator computes. Otherwise
    validation fails.
  you_see: [validation error]
  status: handled

- id: EB-79
  engine: easydiffraction
  versions: easydiffraction 0.21.1 (CrysFML 0.8.0)
  topic: calculators
  title: CrysFML reports no reflection list
  engine_does: >-
    CrysFML reports no reflection list.
  powderline_does: >-
    No peak list reports are written with CrysFML, and the result says so.
  you_see: [easydiffraction_reflections_not_available]
  status: warned

- id: EB-90
  engine: easydiffraction
  versions: easydiffraction 0.21.1 (CrysFML 0.8.0)
  topic: calculators
  title: CrysFML refinements depend on their starting values
  engine_does: >-
    CrysFML computes in single precision, below lmfit's finite-difference
    step. A CrysFML refinement stops at a point that depends on its starting
    values. Starts changed by 1e-6 (relative) gave Rwp 6.79 % against 6.27 %,
    with cells stable to about 1e-5.
  powderline_does: >-
    Every CrysFML refinement carries a warning. The calculator stays
    available because you choose it, and PowderLine states the difference.
  you_see: [easydiffraction_crysfml_start_dependent]
  status: warned

- id: EB-78
  engine: easydiffraction
  versions: easydiffraction 0.21.1 (CrysFML 0.8.0)
  topic: calculators
  title: CrysFML's integrated intensities drift with angle
  engine_does: >-
    Relative to m·|F|²·Lorentz, CrysFML's integrated intensities drift by
    −4 % from 3° to 15° 2θ. This biases `Uiso` by about +0.001 Å².
