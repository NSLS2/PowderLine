- id: EB-93
  engine: easydiffraction
  versions: easydiffraction 0.21.1 (CrysPy 0.13.0, CrysFML 0.8.0)
  topic: calculators
  title: On the temperature series, easydiffraction refines La's Uiso low
  engine_does: >-
    On GSAS-II-calculated LaB6 patterns, easydiffraction refines La's Uiso
    10–22 % low. B's Uiso, the thermal expansion and GoF ≈ 1 agree. The cause
    is the series' profile: GSAS-II clamps its Lorentzian width to
    0.001 centideg above about 10.7°, so the high-angle peaks are pure
    Gaussian. Neither a symmetric pseudo-Voigt nor TCH can represent that,
    and `Uiso` absorbs the mismatch. Simulated with a profile easydiffraction
    can represent, CrysPy's La Uiso is 0.00863 against 0.00858 programmed.
    CrysFML's is 0.00823 (−4 %), the size of its intensity drift (EB-78).
  powderline_does: >-
    Documented, no code change. Across engines, compare cells, with the
    EB-88-size offsets in mind, and the expansion. Absolute `Uiso` agrees only
    when the profile models agree.
  you_see: []
  status: documented
  seen_in: [example_LaB6_temperature_series]

