- id: EB-61
  engine: topas
  versions: TOPAS 6
  topic: platform
  title: TOPAS 6 cannot output the fit's background
  engine_does: >-
    In TOPAS 6, `Get(bkg)` is 0. `phase_out_X` exists in TOPAS 7 only.
  powderline_does: >-
    PowderLine runs a second, background-only INP at the refined values. Its
    calculated pattern, every convolution included, is `y_bkg`. If that run
    writes nothing or hits the time limit, the result stays a success with an
    empty `y_bkg` and a warning. The fit's values, statistics and output
    recipe do not depend on it.
  you_see: [topas_background_not_calculated]
  status: warned

