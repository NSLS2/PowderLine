  engine_does: >-
    easydiffraction refuses negative measured intensities.
  powderline_does: >-
    A negative intensity on a handed point is a validation error.
  you_see: [validation error]
  status: handled

- id: EB-72
  engine: easydiffraction
  versions: easydiffraction 0.21.1
  topic: data
  title: The ASCII data reader rounds 2θ to 4 decimals
  engine_does: >-
    easydiffraction's ASCII data reader rounds 2θ to 4 decimals.
  powderline_does: >-
    The gateway hands the data as a CIF loop at full precision.
  you_see: []
  status: handled

- id: EB-89
  engine: easydiffraction
  versions: easydiffraction 0.21.1
  topic: data
  title: The CIF loop cannot read exponent notation
  engine_does: >-
