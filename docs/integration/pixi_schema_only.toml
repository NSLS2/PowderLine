# pixi.toml template for projects that only need PowderLine's recipe validation.
#
# Use this template if your project:
#   - Builds or validates PowderLine recipe JSON (e.g., a recipe builder or UI)
#   - Does NOT execute refinements directly
#   - Does NOT need GSAS-II or easydiffraction installed
#
# This is the same split PowderLine's own default environment makes: the
# schema layer of every gateway (gsasii.*, topas.*, easydiffraction.*) is
# engine-free, so `powderline.validate()` works here for every schema.
#
# SETUP STEPS:
#   1. Copy this file to your project root as `pixi.toml`
#   2. Replace the placeholder path in [pypi-dependencies] with your local PowderLine clone path
#   3. Edit [workspace] fields (name, version) for your project
#   4. Run: pixi install
#
# NOTE: pip installs PowderLine's own runtime dependencies from pyproject.toml
# (pydantic, numpy, scipy, gemmi ==0.7.5, packaging, pyyaml, pandas, ...);
# only python and pip need declaring here. No engine is installed.

[workspace]
name = "your-project-name"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]  # adjust if targeting other platforms

[dependencies]
python = ">=3.10"

# Needed to perform the editable install of PowderLine
pip = ">=25.0"

[pypi-dependencies]
# EDIT THIS PATH to point to your local clone of the PowderLine repository.
# The editable install also writes the gateway entry points (powderline.gateways)
# the registry discovers; re-run `pixi install` / `pixi reinstall powderline`
# after pulling a PowderLine change to pyproject.toml.
powderline = { path = "/path/to/PowderLine", editable = true }
